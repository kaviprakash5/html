<html>
<head>
    <title>VMK Login</title>
    <style>
        /* Changes the background and text font for the whole page */
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            padding-top: 50px;
        }

        /* Makes the inputs look clean with nice padding and spacing */
        input[type="text"], input[type="password"], input[type="email"] {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid gray;
            border-radius: 4px;
            width: 100%; /* Makes all boxes the same width */
        }

        /* Styles the login and clear buttons */
        input[type="submit"], input[type="reset"] {
            padding: 8px 15px;
            margin: 10px 5px;
            border-radius: 4px;
            border: 1px solid #333;
            cursor: pointer;
        }

        /* Changes the login button color to make it stand out */
        input[type="submit"] {
            background-color: darkblue;
            color: white;
        }

        /* Gives breathing room to the table cells */
        td {
            padding: 5px;
        }
    </style>
</head>
<body>
<center>
    <h1>VMK GADGET STORE</h1>
    <hr width="60%">
    <h2>Login Page</h2>
    
    <form action="home.html">
        <table>
            <tr>
                <td><b>User Name</b></td>
                <td><input type="text" placeholder="Enter Username"></td>
            </tr>
            <tr>
                <td><b>Password</b></td>
                <td><input type="password" placeholder="Enter Password"></td>
            </tr>
            <tr>
                <td><b>Email</b></td>
                <td><input type="email" placeholder="Enter Email"></td>
            </tr>
        </table>
        <br>
        <input type="submit" value="Login">
        <input type="reset" value="Clear">
    </form>
    
    <br><hr width="60%">
    <a href="file:///C:/Users/hari/Documents/register.html">Register Here</a>
</center>
</body>
</html>
