<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laptop</title>
    <style>
        /* Base page styling */
        body {
            background-color: lightcyan;
            font-family: Arial, sans-serif;
            padding: 20px;
            color: #333;
        }

        /* Clean table design with centered content */
        table {
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            vertical-align: middle;
        }

        /* Header row highlights */
        th {
            background-color: #007A78;
            color: white;
        }

        /* Make rating stars gold */
        .stars {
            color: #ff9800;
            font-size: 18px;
        }

        /* Add to cart and submit buttons style */
        button, input[type="submit"] {
            background-color: #007A78;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover, input[type="submit"]:hover {
            background-color: #005654;
        }

        /* Spacing for submit button and links */
        input[type="submit"] {
            margin-top: 20px;
            display: block;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #005654;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>	
<body>
<center>
    <h1>LAPTOP COLLECTION</h1>
    <table>
        <tr>
            <!-- Added missing Product header to line up with the rows -->
            <th>Product</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Video</th>
            <th>Cart</th>
        </tr>
        <tr>
            <!-- Fixed tdalign and imgsrc typos below -->
            <td>
                <img src="HP LINUX" width="120" height="120" alt="HP Laptop"><br>
                <strong>HP</strong>
            </td>
            <td>₹79,999</td>
            <td class="stars">★★★★★</td>
            <td>
                <!-- Reduced width and height so the video fits nicely inside the table row -->
                <video width="200" controls autoplay muted loop>
                    <source src="l.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </td>
            <td>
                <button>Add To Cart</button>
            </td>
        </tr>
        <tr>
            <!-- Fixed tdalign and imgsrc typos below -->
            <td>
                <img src="MSI MODERN B12 MO" width="120" height="120" alt="MSI Laptop"><br>
                <strong>ACERSS</strong>
            </td>
            <td>₹69,999</td>
            <td class="stars">★★★★☆</td>
            <td>
                <!-- Reduced video size to maintain table layout balance -->
                <video width="200" controls autoplay muted loop>
                    <source src="l.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </td>
            <td>
                <button>Add To Cart</button>
            </td>
        </tr>
    </table>
    
    <input type="submit" value="Submit">
    <a href="home.html">Back to Home</a>
</center>
</body>
</html>
