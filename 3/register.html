<html>
<head>
<title>Register</title>
<style>
    /* Changes background color and text font */
    body {
        background-color: lightpink;
        font-family: Arial, sans-serif;
        padding-top: 30px;
    }

    /* Styles all input boxes and textarea uniformly */
    input[type="text"], 
    input[type="date"], 
    input[type="email"], 
    input[type="tel"], 
    input[type="password"], 
    textarea {
        padding: 6px;
        margin: 4px 0;
        border: 1px solid gray;
        border-radius: 4px;
        width: 100%; /* Makes all boxes align perfectly */
        box-sizing: border-box; 
    }

    /* Adds spacing inside the table cells */
    td {
        padding: 6px 12px;
    }

    /* Styles the action buttons */
    input[type="submit"], input[type="reset"] {
        padding: 8px 15px;
        margin: 10px 5px;
        border-radius: 4px;
        border: 1px solid #333;
        cursor: pointer;
    }

    /* Distinct bold color for the primary register button */
    input[type="submit"] {
        background-color: darkred;
        color: white;
    }
</style>
</head>
<body>
<center>
<h1>VMK GADGET STORE</h1>
<hr width="60%">
<h2>Create New Account</h2>
<form action="login.html">
<table>
<tr>
<td><b>Full Name</b></td>
<td><input type="text"></td>
</tr>
<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="g">Male
<input type="radio" name="g">Female
</td>
</tr>
<tr>
<td><b>Date of Birth</b></td>
<td><input type="date"></td>
</tr>
<tr>
<td><b>Email</b></td>
<td><input type="email"></td>
</tr>
<tr>
<td><b>Mobile Number</b></td>
<td><input type="tel"></td>
</tr>
<tr>
<td><b>Address</b></td>
<td><textarea rows="4" cols="25"></textarea></td>
</tr>
<tr>
<td><b>Create Password</b></td>
<td><input type="password"></td>
</tr>
<tr>
<td><b>Confirm Password</b></td>
<td><input type="password"></td>
</tr>
</table>
<br>
<input type="submit" value="Register">
<input type="reset" value="Clear">
</form>
<br><hr width="60%">
<a href="file:///C:/Users/hari/Documents/login.html">Login Here</a>
</center>
</body>
</html>
